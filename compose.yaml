services:
  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
    user: "${RESILIENCE_LAB_UID:-1000}:${RESILIENCE_LAB_GID:-1000}"
    volumes:
      - type: bind
        source: "${RESILIENCE_LAB_WORKSPACE:-./examples}"
        target: /workspace
        read_only: false
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:8080"

server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful

spring:
  main:
    banner-mode: off

springdoc:
  packages-to-scan: resiliencelab.server.lab
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json

resilience-lab:
  workspace: examples

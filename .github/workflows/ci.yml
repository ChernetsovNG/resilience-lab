name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
          cache: gradle
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and verify JVM modules
        run: ./gradlew --no-daemon clean build
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Lint frontend
        working-directory: web
        run: npm run lint
      - name: Test frontend
        working-directory: web
        run: npm test -- --run
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: |
            core/build/reports/jacoco/test
            apps/cli/build/reports/jacoco/test
            apps/server/build/reports/jacoco/test
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: &playwright-image mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Playwright image matches lock file
        env:
          PLAYWRIGHT_IMAGE: *playwright-image
        run: |
          node <<'NODE'
          const version = require('./web/package-lock.json').packages['node_modules/@playwright/test'].version;
          const expected = `mcr.microsoft.com/playwright:v${version}-noble`;
          if (process.env.PLAYWRIGHT_IMAGE !== expected) {
            console.error(`Playwright image mismatch: lock file requires ${expected}. Update jobs.e2e.container.image in .github/workflows/ci.yml.`);
            process.exit(1);
          }
          console.log(`Playwright image matches @playwright/test ${version}.`);
          NODE
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
          cache: gradle
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run real browser workflows
        working-directory: web
        run: GRADLE_USER_HOME="$HOME/.gradle" npm run test:e2e -- --reporter=line,html
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: warn

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # build and e2e are required checks, so a docs-only pull request skips them
  # at job level: a skipped job satisfies the check, a skipped workflow does not.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changes outside documentation
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -v -E '^docs/|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-jvm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
          cache-jdk: false
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v5
        with: &gradle-cache
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-includes: |
            caches/modules-2
            wrapper/dists
          # These are extracted separately, even when omitted from cache-includes.
          gradle-home-cache-excludes: |
            caches/*/generated-gradle-jars
            caches/*/kotlin-dsl
            caches/*/groovy-dsl
            caches/*/transforms
            caches/jars-*
            caches/transforms-*
            jdks
      - name: Build and verify JVM modules
        run: ./gradlew --no-daemon clean build
      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: |
            core/build/reports/jacoco/test
            apps/cli/build/reports/jacoco/test
            apps/server/build/reports/jacoco/test
          if-no-files-found: error

  build-web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with: &node-setup
          node-version-file: web/.nvmrc
          cache: ${{ github.ref == 'refs/heads/main' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
          package-manager-cache: false
      - name: Locate npm cache
        if: github.ref != 'refs/heads/main'
        id: npm-cache
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm cache without saving
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v5
        with: &npm-cache
          path: ${{ steps.npm-cache.outputs.path }}
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('web/package-lock.json') }}
      - name: Verify Node.js Docker image matches .nvmrc
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const version = readFileSync('web/.nvmrc', 'utf8').trim();
          const dockerfile = readFileSync('web/Dockerfile', 'utf8');
          const image = dockerfile.match(/^FROM\s+(node:\S+)/m)?.[1];
          const expected = `node:${version}-alpine`;
          if (image !== expected) {
            console.error(`Node.js image mismatch: web/.nvmrc requires ${expected}. Update web/Dockerfile and web/.nvmrc together.`);
            process.exit(1);
          }
          console.log(`Node.js Docker image matches web/.nvmrc ${version}.`);
          NODE
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Lint frontend
        working-directory: web
        run: npm run lint
      - name: Check generated API types
        working-directory: web
        run: npm run api:check
      - name: Test frontend with coverage
        working-directory: web
        run: npm run test:coverage
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: web/coverage
          if-no-files-found: warn

  build:
    needs: [changes, build-jvm, build-web]
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both builds to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          JVM_RESULT: ${{ needs.build-jvm.result }}
          WEB_RESULT: ${{ needs.build-web.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$JVM_RESULT" = success
          test "$WEB_RESULT" = success

  e2e-server:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
          cache-jdk: false
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v5
        with: *gradle-cache
      - name: Package E2E server
        run: |
          ./gradlew --no-daemon :apps:server:bootJar
          cp apps/server/build/libs/*.jar e2e-server.jar
      - name: Upload E2E server
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server
          path: e2e-server.jar
          if-no-files-found: error
          retention-days: 1

  e2e-shard:
    needs: changes
    permissions:
      contents: read
      actions: read
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: &playwright-image mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with: *node-setup
      - name: Locate npm cache
        if: github.ref != 'refs/heads/main'
        id: npm-cache
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm cache without saving
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v5
        with: *npm-cache
      - name: Verify Playwright image matches lock file
        env:
          PLAYWRIGHT_IMAGE: *playwright-image
        run: |
          node <<'NODE'
          const version = require('./web/package-lock.json').packages['node_modules/@playwright/test'].version;
          const expected = `mcr.microsoft.com/playwright:v${version}-noble`;
          if (process.env.PLAYWRIGHT_IMAGE !== expected) {
            console.error(`Playwright image mismatch: lock file requires ${expected}. Update jobs.e2e-shard.container.image in .github/workflows/ci.yml.`);
            process.exit(1);
          }
          console.log(`Playwright image matches @playwright/test ${version}.`);
          NODE
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '25'
          cache-jdk: false
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Wait for E2E server
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/jobs?filter=all&per_page=100`;
          for (;;) {
            const response = await fetch(url, {
              headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}` },
            });
            if (!response.ok) throw new Error(`Cannot read E2E server status: HTTP ${response.status}`);
            const { jobs } = await response.json();
            const server = jobs.filter(job => job.name === 'e2e-server').sort((a, b) => b.id - a.id)[0];
            if (server?.status === 'completed') {
              if (server.conclusion !== 'success') throw new Error(`E2E server ended with ${server.conclusion}`);
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          NODE
      - name: Download E2E server
        uses: actions/download-artifact@v8
        with:
          name: e2e-server
          path: .e2e-server
      - name: Run real browser workflows
        working-directory: web
        env:
          E2E_SERVER_JAR: .e2e-server/e2e-server.jar
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --reporter=line,html
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ matrix.shard }}
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: warn

  e2e:
    needs: [changes, e2e-server, e2e-shard]
    if: ${{ always() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the server and every shard to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SERVER_RESULT: ${{ needs.e2e-server.result }}
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$SERVER_RESULT" = success
          test "$SHARDS_RESULT" = success
